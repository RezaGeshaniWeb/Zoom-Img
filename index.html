<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Img</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/output.css">
</head>

<body>
    <main class="w-full lg:h-screen bg-gray-900 py-5 px-10 select-none">
        <div class="2xl:container w-full h-full mx-auto">
            <div class="flex items-center gap-2 w-full h-[5%] mb-12 p-4">
                <a class="text-slate-400 text-sm" href="#">Home</a>
                <span class="text-slate-400 text-sm">></span>
                <a class="text-slate-400 text-sm" href="#">Men</a>
                <span class="text-slate-400 text-sm">></span>
                <a class="text-white text-base" href="#">Tony Hunfinger T-Shirt New York</a>
            </div>
            <div
                class="flex flex-col lg:flex-row lg:justify-between w-full h-[85%] *:w-full *:lg:w-[49%] *:xl:w-1/2 *:h-full p-4">
                <div class="flex mb-10 lg:mb-0">
                    <div
                        class="w-[30%] lg:w-[20%] *:w-[75%] *:rounded-md *:object-cover *:cursor-pointer h-[410px] img-product">
                        <img src="img/4.jpg" alt="" class="mb-4 h-1/5">
                        <img src="img/1.webp" alt="" class="mb-4 h-1/5">
                        <img src="img/2.jpg" alt="" class="mb-4 h-1/5">
                        <img src="img/3.jpg" alt="" class="h-1/5">
                    </div>
                    <figure class="w-[440px] h-[440px] figure-zoom overflow-hidden rounded-md group">
                        <img src="img/4.jpg"
                            class="w-full h-full object-cover rounded-md transition-transform cursor-pointer" alt=""
                            id="change-img">
                    </figure>
                </div>
                <div class="*:text-white">
                    <h2 class="text-2xl mb-4">Tony Hunfinger T-Shirt New York</h2>
                    <div class="flex items-center gap-5 mb-5">
                        <h4 class="text-blue-600 text-4xl font-bold">$800.00</h4>
                        <a href="#" class="text-slate-400 text-sm">Free shipping</a>
                    </div>
                    <div class="w-[90%] h-[1px] bg-slate-400 bg-opacity-50 mb-5"></div>
                    <div class="flex flex-col lg:flex-row w-full lg:items-center lg:justify-between mb-14">
                        <div class="w-1/2 mb-10 lg:mb-0">
                            <p class="mb-3 text-sm font-semibold">SIZE</p>
                            <div
                                class="flex items-center gap-3 *:w-[44px] *:h-[44px] *:border *:border-slate-400 *:rounded-full">
                                <button
                                    class="focus:border-blue-500 focus:text-blue-500 transition-all duration-300">M</button>
                                <button
                                    class="focus:border-blue-500 focus:text-blue-500 transition-all duration-300">L</button>
                                <button
                                    class="focus:border-blue-500 focus:text-blue-500 transition-all duration-300">XL</button>
                                <button
                                    class="focus:border-blue-500 focus:text-blue-500 transition-all duration-300">XXL</button>
                            </div>
                        </div>
                        <div class="w-[70%] lg:w-1/2 select-none">
                            <p class="mb-3 text-sm font-semibold">COLOR</p>
                            <div class="flex items-center gap-3">
                                <button
                                    class="w-[44px] h-[44px] border border-slate-400 rounded-full transition-all duration-300 flex justify-center items-center cursor-pointer circle-color focus:border-blue-400">
                                    <span
                                        class="bg-blue-500 w-[28px] h-[28px] rounded-full flex justify-center items-center">
                                    </span>
                                </button>
                                <button
                                    class="w-[44px] h-[44px] border border-slate-400 rounded-full transition-all duration-300 flex justify-center items-center cursor-pointer circle-color focus:border-red-400">
                                    <span
                                        class="bg-red-500 w-[28px] h-[28px] rounded-full flex justify-center items-center">
                                    </span>
                                </button>
                                <button
                                    class="w-[44px] h-[44px] border border-slate-400 rounded-full transition-all duration-300 flex justify-center items-center cursor-pointer circle-color focus:border-yellow-400">
                                    <span
                                        class="bg-yellow-500 w-[28px] h-[28px] rounded-full flex justify-center items-center">
                                    </span>
                                </button>
                                <a href="#" class="text-slate-400 text-sm">size guide</a>
                            </div>
                        </div>
                    </div>
                    <div class="flex w-full items-center gap-7">
                        <button
                            class="bg-blue-600 rounded-full border-blue-600 h-[40px] w-28 flex justify-center items-center">Add
                            To Cart</button>
                        <div class="w-44 h-[40px] flex bg-gray-800 rounded-full *:border-red-200 overflow-hidden">
                            <span
                                class="font-bold cursor-pointer hover:bg-gray-700 transition-all duration-300 flex w-1/3 justify-center items-center counter">-</span>
                            <span class="flex w-1/3 justify-center items-center">1 Qty</span>
                            <span
                                class="font-bold cursor-pointer hover:bg-gray-700 transition-all duration-300 flex w-1/3 justify-center items-center counter">+</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- info -->
        <div class="hidden w-[170px] h-[170px] rounded-full border-[1px] border-infoColor outline-[1px] outline-infoColor 
    outline-offset-8 fixed bottom-[50px] right-[40px] lg:flex items-center justify-center select-none z-50 group">
            <div class="circle w-[165px] h-[165px] rounded-full">
                <img src="img/me5.webp" alt="" class="w-full h-full rounded-full object-cover">
            </div>
            <strong class="absolute top-[45%] right-[-87px] rotate-[90deg] text-[15px] italic text-infoColor">Frontend
                Developer</strong>
            <a href="https://www.linkedin.com/in/reza-geshani-web"><i
                    class="bi bi-linkedin group-hover:visible text-[26px] text-white absolute invisible transition-all duration-150 py-[10px] px-[30px] hover:opacity-100 hover:text-[#1f9caa] top-[-10px] left-[-58px]"></i></a>
            <a href="https://www.instagram.com/rezageshani_web"><i
                    class="bi bi-instagram group-hover:visible text-[26px] absolute invisible transition-all duration-150 py-[10px] px-[30px] hover:opacity-100 hover:text-[#1f9caa] text-white top-[40px] left-[-80px]"></i></a>
            <a href="https://github.com/RezaGeshaniWeb/"><i
                    class="bi bi-github group-hover:visible text-[26px] absolute invisible transition-all duration-150 py-[10px] px-[30px] hover:opacity-100 hover:text-[#1f9caa] text-white top-[90px] left-[-80px]"></i></a>
            <a href="mailto:rezageshaniweb@gmail.com"><i
                    class="bi bi-envelope-at group-hover:visible text-[26px] absolute invisible transition-all duration-150 py-[10px] px-[30px] hover:opacity-100 hover:text-[#1f9caa] text-white top-[130px] left-[-58px]"></i></a>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
